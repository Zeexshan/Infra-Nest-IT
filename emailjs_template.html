<div style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
  <h2 style="color: #0ea5e9;">New Project Inquiry</h2>
  <p>You have received a new message from the website contact form.</p>
  
  <div style="background-color: #f4f4f5; padding: 15px; border-radius: 8px; margin: 20px 0;">
    <p><strong>Name:</strong> {{user_name}}</p>
    <p><strong>Email:</strong> {{user_email}}</p>
    <p><strong>Phone:</strong> {{contact_number}}</p>
  </div>

  <h3>Message:</h3>
  <div style="border-left: 4px solid #0ea5e9; padding-left: 15px; margin-top: 10px;">
    <p style="white-space: pre-wrap;">{{message}}</p>
  </div>
  
  <hr style="border: 0; border-top: 1px solid #eee; margin-top: 30px;" />
  <p style="font-size: 12px; color: #888;">Sent from Infra Nest IT Website</p>
</div>
